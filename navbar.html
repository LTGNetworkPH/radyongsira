    <style>
        .rs-nav { font-family: var(--font-secondary, Roboto, Arial, sans-serif); }
        .rs-nav .container { max-width: 1100px; margin: 0 auto; display:flex; align-items:center; padding:.5rem 1rem; gap:1rem; }
        .rs-brand { color: var(--color-title,#fff); font-weight:700; text-decoration:none; margin-right:auto; }
        .rs-toggle { background:transparent; border:0; color:var(--color-title,#fff); width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer }
        .rs-bars { display:inline-block; width:20px; height:2px; background:currentColor; position:relative }
        .rs-bars::before, .rs-bars::after { content:""; position:absolute; left:0; width:100%; height:2px; background:currentColor }
        .rs-bars::before { top:-6px } .rs-bars::after { top:6px }

        .rs-menu { list-style:none; margin:0; padding:0; display:flex; gap:1rem; align-items:center }
        .rs-menu a { color:var(--color-text,#c4c4c4); text-decoration:none; padding:.5rem .6rem; display:block; font-weight:600 }
        .rs-menu a:hover, .rs-menu a:focus { color:var(--color-title,#fff); }

        /* Mobile: hide menu, show toggle */
        @media (max-width: 900px) {
            .rs-menu { position:fixed; right:0; top:0; height:100%; width:280px; background:var(--bg-black,#000); flex-direction:column; padding:3.5rem 1rem; transform:translateX(100%); transition:transform .28s ease-in-out; box-shadow: -10px 0 30px rgba(0,0,0,.4); z-index:1200 }
            .rs-menu.open { transform:translateX(0); }
            .rs-toggle { display:inline-flex }
            .rs-brand { margin-right:0 }
        }

        /* Desktop: hide toggle */
        @media (min-width: 901px) {
            .rs-toggle { display:none }
        }
    </style>

    <script>
        (function(){
            const toggle = document.currentScript && document.currentScript.previousElementSibling ? document.currentScript.previousElementSibling.querySelector('.rs-toggle') : document.querySelector('.rs-toggle');
            const menu = document.getElementById('rs-menu');
            if (!toggle || !menu) return;
            
            function setOpen(open){
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                menu.classList.toggle('open', !!open);
            }
            
            // Handler functions for cleanup
            const handleToggleClick = ()=> setOpen(menu.classList.toggle('open'));
            const handleEscape = (e)=>{ if(e.key==='Escape' && menu.classList.contains('open')) setOpen(false); };
            const handleMenuClick = (e)=>{ if(e.target.tagName==='A') setOpen(false); };
            const handleOutsideClick = (e)=>{ if(menu.classList.contains('open') && !menu.contains(e.target) && !toggle.contains(e.target)) setOpen(false); };
            const handleResize = ()=>{ if(window.innerWidth>900) setOpen(false); };
            
            // Attach listeners
            toggle.addEventListener('click', handleToggleClick);
            document.addEventListener('keydown', handleEscape);
            menu.addEventListener('click', handleMenuClick);
            document.addEventListener('click', handleOutsideClick);
            window.addEventListener('resize', handleResize);
            
            // Cleanup function for page unload/navigation
            function cleanup(){
                toggle.removeEventListener('click', handleToggleClick);
                document.removeEventListener('keydown', handleEscape);
                menu.removeEventListener('click', handleMenuClick);
                document.removeEventListener('click', handleOutsideClick);
                window.removeEventListener('resize', handleResize);
            }
            
            // Add cleanup handlers
            window.addEventListener('beforeunload', cleanup, { once: true });
            window.addEventListener('unload', cleanup, { once: true });
        })();
    </script>
